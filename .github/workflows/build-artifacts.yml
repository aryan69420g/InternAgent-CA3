name: Build CA-3 presentation and report

on:
  push:
    branches: [main]
    paths-ignore:
      - "CA3_Agentic_AI_Presentation.pptx"
      - "CA3_Technical_Report.docx"
      - "docs/architecture.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install artifact builder dependencies
        run: python -m pip install --upgrade Pillow python-pptx python-docx
      - name: Generate diagram, PowerPoint and Word report
        run: python build_submission_artifacts.py
      - name: Commit generated submission files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CA3_Agentic_AI_Presentation.pptx CA3_Technical_Report.docx docs/architecture.png
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
          else
            git commit -m "Build CA-3 submission artifacts"
            git push origin HEAD:main
          fi
